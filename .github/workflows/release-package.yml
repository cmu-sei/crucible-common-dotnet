name: Release package to NuGet

on:
  workflow_dispatch:
    inputs:
      packageName:
        description: "The NuGet package (which corresponds to a Crucible.Common project) you want to release"
        required: true
        type: choice
        options:
          - Crucible.Common.Authentication
          - Crucible.Common.EntityEvents
          - Crucible.Common.ServiceDefaults
          - Crucible.Common.Utilities
      versionNumber:
        description: "A semver version string without a leading v (e.g. 1.0.0)"
        required: true
        type: string

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/dotnet-test.yaml@dotnet-test-v1
    permissions:
      contents: read
    with:
      test-project: test/Crucible.Common.Tests
      expect-postgres: false
      dotnet-version: "10.0.x"

  # Builds and packs only (auth-mode: trusted). nuget.org rejects a trusted-
  # publishing token issued to a reusable workflow in another repository, so
  # the push happens in the publish job below, which this file defines.
  pack:
    needs: build-and-test
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/nuget-release.yaml@nuget-v1
    permissions:
      contents: read
    with:
      version: ${{ inputs.versionNumber }}
      project: src/${{ inputs.packageName }}/${{ inputs.packageName }}.csproj
      include-symbols: true
      license-expression: ""       # keep each project's <PackageLicenseFile> (the SEI LICENSE.md)
      dotnet-version: "10.0.x"     # repo has no global.json
      auth-mode: trusted

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # tag (created only after a successful push)
      id-token: write          # NuGet trusted publishing (OIDC -> short-lived push key)
    steps:
      - uses: cmu-sei/Crucible-Github-Actions/actions/nuget-publish@nuget-v1
        with:
          package-id: ${{ needs.pack.outputs.package-id }}
          version: ${{ needs.pack.outputs.version }}
          nuget-user: ${{ vars.NUGET_USER }}
          github-release: tag
          release-tag: ${{ inputs.packageName }}-${{ inputs.versionNumber }}
