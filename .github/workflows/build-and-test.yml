# Builds the libraries and runs Crucible.Common.Tests with the shared Crucible workflow; see the
# .NET Build and Test section of https://github.com/cmu-sei/Crucible-Github-Actions.
name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/dotnet-test.yaml@dotnet-test-v1
    permissions:
      contents: read
    with:
      test-project: test/Crucible.Common.Tests
      # The EntityEvents tests start PostgreSQL themselves but print no harness banner.
      expect-postgres: false
      dotnet-version: "10.0.x"     # global.json sets only the test runner, not the SDK
